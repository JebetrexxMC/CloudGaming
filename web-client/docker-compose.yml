# Play in any browser (phone, Chromebook, school PC) - no app install needed.
# moonlight-web-stream pairs with Apollo/Sunshine like a normal Moonlight client
# and re-streams to the browser over WebRTC.
#
# Run it on the gaming host itself (Docker Desktop / WSL) or any box that can reach it,
# e.g. over Tailscale/ZeroTier.
services:
  moonlight-web:
    image: ${ML_WEB_IMAGE:-ghcr.io/jebetrexxmc/moonlight-web-stream}:${ML_WEB_VERSION:-latest}  # fallback: ML_WEB_IMAGE=mrcreativ3001/moonlight-web-stream
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "40000-40100:40000-40100/udp"
    environment:
      WEBRTC_PORT_RANGE: "40000:40100"
      WEBRTC_NAT_1TO1_HOST: ${PUBLIC_OR_VPN_IP:?set PUBLIC_OR_VPN_IP in .env}
    volumes:
      - ./data:/app/server
