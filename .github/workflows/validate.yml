name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path host-windows -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: apps.json is valid JSON
        shell: pwsh
        run: Get-Content host-windows/apps.genshin.json -Raw | ConvertFrom-Json | Out-Null

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  compose-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          PUBLIC_OR_VPN_IP=127.0.0.1 docker compose -f web-client/docker-compose.yml config -q
          docker compose -f linux-wolf/docker-compose.yml config -q
      - name: shellcheck
        run: shellcheck scripts/*.sh cloud/cloudypad/*.sh
